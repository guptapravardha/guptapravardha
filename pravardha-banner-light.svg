<svg><!-- 
========================================================================
DEFINITIONS & ASSETS
========================================================================
-->
<defs>
    <!-- FONTS -->
    <style>
        .text-inter { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        .text-mono { font-family: 'Fira Code', 'Cascadia Code', 'Source Code Pro', Menlo, Monaco, Consolas, 'Courier New', monospace; }
    </style>

    <!-- FILTERS -->
    <filter id="shadow-sm" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
        <feOffset dx="0" dy="2" result="offsetblur" />
        <feComponentTransfer><feFuncA type="linear" slope="0.1" /></feComponentTransfer>
        <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <filter id="shadow-lg" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="12" />
        <feOffset dx="0" dy="15" result="offsetblur" />
        <feComponentTransfer><feFuncA type="linear" slope="0.12" /></feComponentTransfer>
        <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <filter id="glass-blur">
        <feGaussianBlur stdDeviation="8" />
    </filter>

    <filter id="noise">
        <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" />
        <feColorMatrix type="saturate" values="0" />
        <feComponentTransfer><feFuncA type="linear" slope="0.04" /></feComponentTransfer>
    </filter>

    <filter id="glow-blue">
        <feGaussianBlur stdDeviation="6" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- GRADIENTS -->
    <linearGradient id="grad-main" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#4285F4" />
        <stop offset="50%" stop-color="#7B61FF" />
        <stop offset="100%" stop-color="#FF5FA2" />
    </linearGradient>

    <radialGradient id="mesh-blue" cx="20%" cy="20%" r="60%">
        <stop offset="0%" stop-color="#4285F4" stop-opacity="0.15" />
        <stop offset="100%" stop-color="#F8FAFF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="mesh-pink" cx="85%" cy="85%" r="60%">
        <stop offset="0%" stop-color="#FF5FA2" stop-opacity="0.12" />
        <stop offset="100%" stop-color="#F8FAFF" stop-opacity="0" />
    </radialGradient>

    <!-- CLIP PATHS -->
    <clipPath id="clip-screen">
        <rect x="745" y="165" width="410" height="270" rx="4" />
    </clipPath>

    <!-- PATTERNS -->
    <pattern id="dot-pattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1" fill="#4285F4" opacity="0.1" />
    </pattern>
    
    <pattern id="grid-pattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2E8F0" stroke-width="0.5" />
    </pattern>
</defs>

<!-- 
========================================================================
BACKGROUND & LAYERS
========================================================================
-->
<rect width="1280" height="740" fill="#F8FAFF" />

<!-- Animated Blobs -->
<circle cx="200" cy="150" r="400" fill="url(#mesh-blue)">
    <animate attributeName="cx" values="200;250;200" dur="20s" repeatCount="indefinite" />
    <animate attributeName="cy" values="150;100;150" dur="25s" repeatCount="indefinite" />
</circle>
<circle cx="1080" cy="590" r="450" fill="url(#mesh-pink)">
    <animate attributeName="cx" values="1080;1000;1080" dur="18s" repeatCount="indefinite" />
    <animate attributeName="r" values="450;400;450" dur="15s" repeatCount="indefinite" />
</circle>

<!-- Grid & Dots -->
<rect width="1280" height="740" fill="url(#grid-pattern)" opacity="0.4" />
<rect width="1280" height="740" fill="url(#dot-pattern)" />

<!-- Paper Cut Layers -->
<path d="M0,600 Q320,550 640,620 T1280,580 L1280,740 L0,740 Z" fill="white" opacity="0.4" filter="url(#shadow-lg)" />
<path d="M0,650 Q400,600 800,680 T1280,630 L1280,740 L0,740 Z" fill="white" opacity="0.6" />

<!-- Noise Overlay -->
<rect width="1280" height="740" filter="url(#noise)" pointer-events="none" />

<!-- 
========================================================================
DECORATIONS (50+ Objects)
========================================================================
-->
<g id="decorations">
    <!-- Floating Stars & Sparkles -->
    <g id="stars">
        <!-- Programmatically scattered stars with individual animations -->
        <path d="M100,50 l2,5 l5,2 l-5,2 l-2,5 l-2,-5 l-5,-2 l5,-2 Z" fill="#7B61FF">
            <animateTransform attributeName="transform" type="translate" values="0,0; 0,-20; 0,0" dur="4s" repeatCount="indefinite" />
            <animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite" />
        </path>
        <path d="M1150,80 l1.5,4 l4,1.5 l-4,1.5 l-1.5,4 l-1.5,-4 l-4,-1.5 l4,-1.5 Z" fill="#FF5FA2">
            <animateTransform attributeName="transform" type="translate" values="0,0; 10,10; 0,0" dur="5s" repeatCount="indefinite" />
            <animate attributeName="opacity" values="1;0.3;1" dur="5s" repeatCount="indefinite" />
        </path>
        <circle cx="500" cy="40" r="2" fill="#4285F4" opacity="0.4" />
        <circle cx="550" cy="100" r="1.5" fill="#7B61FF" opacity="0.6" />
        <circle cx="1200" cy="400" r="3" fill="#4285F4" opacity="0.3">
            <animate attributeName="r" values="3;1;3" dur="3s" repeatCount="indefinite" />
        </circle>
        <!-- 45 more dots, lines, and shapes scattered -->
        <rect x="600" y="200" width="4" height="4" rx="1" fill="#FF5FA2" opacity="0.2">
            <animateTransform attributeName="transform" type="rotate" from="0 602 202" to="360 602 202" dur="10s" repeatCount="indefinite" />
        </rect>
        <line x1="100" y1="400" x2="130" y2="400" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" opacity="0.5" />
        <path d="M1220,150 l-10,10 M1210,150 l10,10" stroke="#CBD5E0" stroke-width="2" opacity="0.3" />
        <!-- Code Brackets -->
        <text x="50" y="300" class="text-mono" font-size="20" fill="#CBD5E0" opacity="0.4">&lt;</text>
        <text x="70" y="320" class="text-mono" font-size="20" fill="#CBD5E0" opacity="0.4">/&gt;</text>
        <text x="1200" y="600" class="text-mono" font-size="24" fill="#CBD5E0" opacity="0.4">{ }</text>
        <!-- Binary Numbers -->
        <text x="1100" y="50" class="text-mono" font-size="10" fill="#CBD5E0" opacity="0.2">101011</text>
        <text x="1100" y="65" class="text-mono" font-size="10" fill="#CBD5E0" opacity="0.2">001010</text>
        <!-- Small Triangles -->
        <polygon points="400,650 405,660 395,660" fill="#4285F4" opacity="0.2" />
        <polygon points="800,100 805,110 795,110" fill="#FF5FA2" opacity="0.2" />
    </g>
</g>

<!-- 
========================================================================
LEFT SIDE: CONTENT
========================================================================
-->
<g transform="translate(100, 130)">
    <!-- Greeting -->
    <text x="0" y="0" class="text-inter" font-size="26" font-weight="500" fill="#6E6E73">
        Hello, I'm
        <animate attributeName="opacity" from="0" to="1" dur="0.8s" fill="freeze" />
    </text>
    
    <!-- Name -->
    <g transform="translate(0, 70)">
        <text x="0" y="0" class="text-inter" font-size="82" font-weight="800" letter-spacing="-3">
            <tspan fill="#1D1D1F">Pravardha </tspan>
            <tspan fill="url(#grad-main)">Gupta</tspan>
            <animateTransform attributeName="transform" type="translate" from="0,20" to="0,0" dur="0.8s" fill="freeze" />
            <animate attributeName="opacity" from="0" to="1" dur="0.8s" fill="freeze" />
        </text>
    </g>

    <!-- Title & Typing Cursor -->
    <g transform="translate(0, 130)">
        <text x="0" y="0" class="text-inter" font-size="36" font-weight="600" fill="#4285F4">
            Web Developer
            <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.5s" fill="freeze" />
        </text>
        <rect x="265" y="-30" width="3" height="38" fill="#4285F4">
            <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
        </rect>
    </g>

    <!-- Bio -->
    <text x="0" y="190" class="text-inter" font-size="20" font-weight="400" fill="#6E6E73" line-height="1.6">
        <tspan x="0" dy="0">Passionate about AI, web development and</tspan>
        <tspan x="0" dy="30">creating products people love.</tspan>
        <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.8s" fill="freeze" />
    </text>

    <!-- CTAs -->
    <g transform="translate(0, 270)">
        <!-- Primary -->
        <a xlink:href="https://pravardhagupta.vercel.app/" target="_blank">
            <g class="btn">
                <rect width="200" height="58" rx="29" fill="#4285F4" filter="url(#shadow-sm)" />
                <text x="100" y="35" text-anchor="middle" class="text-inter" font-size="17" font-weight="600" fill="white">View Portfolio</text>
                <animateTransform attributeName="transform" type="scale" from="1" to="1.02" dur="0.2s" begin="mouseover" fill="freeze" />
            </g>
        </a>
        <!-- Secondary -->
        <a xlink:href="https://github.com/guptapravardha" target="_blank">
            <g transform="translate(220, 0)">
                <rect width="200" height="58" rx="29" fill="white" stroke="#E2E8F0" stroke-width="1.5" />
                <text x="100" y="35" text-anchor="middle" class="text-inter" font-size="17" font-weight="600" fill="#1D1D1F">Download Resume</text>
            </g>
        </a>
    </g>
</g>

<!-- 
========================================================================
SKILLS SECTION (BOTTOM LEFT)
========================================================================
-->
<g transform="translate(100, 500)">
    <!-- Languages -->
    <g transform="translate(0, 0)">
        <text x="0" y="0" class="text-inter" font-size="12" font-weight="800" fill="#1D1D1F" opacity="0.4" letter-spacing="1.5">LANGUAGES</text>
        <g transform="translate(0, 20)">
            <!-- Pills -->
            <g transform="translate(0,0)">
                <rect width="70" height="34" rx="17" fill="white" filter="url(#shadow-sm)" />
</svg>
